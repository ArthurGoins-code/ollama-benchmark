name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Compile + task-definition tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Byte-compile
        run: python -m py_compile ollama_coding_benchmark.py

      - name: CLI sanity checks
        run: |
          python ollama_coding_benchmark.py --version
          python ollama_coding_benchmark.py --list-tasks

      - name: Lint (ruff)
        run: ruff check .

      - name: Task-definition tests (reference solutions + rejection)
        run: python tests/test_task_definitions.py